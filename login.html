<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belle·Agenda · Entrar</title>
<meta name="description" content="Entre na sua conta Belle·Agenda e gerencie sua agenda de beleza, clientes, PIX e WhatsApp em um só lugar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7F4;--surface:#FFFFFF;--ink:#2A1F2E;--ink-soft:#6B5B6E;--accent:#C9376C;--accent-soft:#F4D5DD;--gold:#B8956A;--line:#EDE5E3;--shadow:0 4px 24px rgba(42,31,46,.06);--shadow-lg:0 12px 40px rgba(42,31,46,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;
  background-image:radial-gradient(circle at 15% 10%,rgba(244,213,221,.5) 0%,transparent 50%),radial-gradient(circle at 90% 90%,rgba(184,149,106,.1) 0%,transparent 40%)}
.card{background:var(--surface);border-radius:24px;padding:48px 44px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.brand{text-align:center;margin-bottom:36px}
.brand h1{font-family:'DM Serif Display';font-size:36px;letter-spacing:-.5px}
.brand h1 em{color:var(--accent);font-style:italic}
.brand p{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--ink-soft);margin-top:8px}
.tab-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border-radius:12px;padding:5px;margin-bottom:28px}
.tab{border:none;background:none;padding:10px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);transition:.2s}
.tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{margin-bottom:16px}
label{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px;font-weight:600}
input{width:100%;padding:13px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;font-family:inherit;font-size:14px;transition:.2s}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.btn{width:100%;padding:14px;border-radius:50px;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;transition:.2s;margin-top:8px}
.btn-primary{background:var(--accent);color:white}
.btn-primary:hover{background:#A82959;transform:translateY(-1px);box-shadow:0 6px 20px rgba(201,55,108,.3)}
.divider{text-align:center;font-size:12px;color:var(--ink-soft);margin:18px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:var(--line)}
.divider::before{left:0}.divider::after{right:0}
.link{background:none;border:none;color:var(--accent);font-family:inherit;font-size:13px;cursor:pointer;text-decoration:underline;display:block;text-align:center;margin-top:14px}
.error{padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none}
.error.show{display:block}
.error.err{background:#FEE2E2;border:1px solid #FECACA;color:#B91C1C}
.error.ok{background:#D1FAE5;border:1px solid #A7F3D0;color:#065F46}
@media(max-width:480px){
  .card{padding:32px 22px}
  .brand h1{font-size:30px}
  .brand{margin-bottom:24px}
}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <h1>Belle<em>·</em>Agenda</h1>
    <p>Beleza & Saúde · v2.0</p>
  </div>

  <div class="tab-row">
    <button class="tab active" id="tabLogin" onclick="switchTab('login')">Entrar</button>
    <button class="tab" id="tabReg" onclick="switchTab('reg')">Criar conta</button>
  </div>

  <div id="errorBox" class="error"></div>

  <!-- LOGIN -->
  <div id="formLogin">
    <div class="field"><label>E-mail</label><input id="loginEmail" type="email" placeholder="seu@email.com" autocomplete="email"></div>
    <div class="field"><label>Senha</label><input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn btn-primary" onclick="doLogin()">Entrar</button>
    <button class="link" onclick="doReset()">Esqueci a senha</button>
  </div>

  <!-- REGISTER -->
  <div id="formReg" style="display:none">
    <div class="field"><label>Nome do salão / profissional</label><input id="regName" placeholder="Studio Silva"></div>
    <div class="field"><label>E-mail</label><input id="regEmail" type="email" placeholder="seu@email.com" autocomplete="email"></div>
    <div class="field"><label>Senha</label><input id="regPass" type="password" placeholder="mínimo 6 caracteres" autocomplete="new-password"></div>
    <button class="btn btn-primary" onclick="doRegister()">Criar conta</button>
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-analytics-compat.js"></script>
<script>
firebase.initializeApp(firebaseConfig);
firebase.analytics();
const auth = firebase.auth();
const db = firebase.firestore();

// Captura código de indicação da URL e persiste na sessão
const _refParam = new URLSearchParams(window.location.search).get('ref');
if (_refParam) sessionStorage.setItem('refCode', _refParam);

auth.onAuthStateChanged(user => {
  if (user) window.location.href = '/app';
});

function switchTab(t) {
  document.getElementById('formLogin').style.display = t==='login' ? 'block' : 'none';
  document.getElementById('formReg').style.display = t==='reg' ? 'block' : 'none';
  document.getElementById('tabLogin').classList.toggle('active', t==='login');
  document.getElementById('tabReg').classList.toggle('active', t==='reg');
  showError('');
}

function showError(msg, ok=false) {
  const el = document.getElementById('errorBox');
  el.textContent = msg;
  el.classList.toggle('show', !!msg);
  el.classList.toggle('err', !!msg && !ok);
  el.classList.toggle('ok', !!msg && ok);
}

const msgs = {
  'auth/user-not-found': 'E-mail não cadastrado.',
  'auth/wrong-password': 'Senha incorreta.',
  'auth/email-already-in-use': 'E-mail já cadastrado.',
  'auth/weak-password': 'Senha muito fraca (mín. 6 caracteres).',
  'auth/invalid-email': 'E-mail inválido.',
  'auth/invalid-credential': 'E-mail ou senha incorretos.',
};

function friendly(e) { return msgs[e.code] || e.message; }

async function doLogin() {
  showError('');
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if (!email || !pass) { showError('Preencha e-mail e senha.'); return; }
  const btn = document.querySelector('#formLogin .btn-primary');
  if(btn){btn.disabled=true;btn.textContent='Entrando...';}
  try {
    await auth.signInWithEmailAndPassword(email, pass);
  } catch(e) {
    showError(friendly(e));
    if(btn){btn.disabled=false;btn.textContent='Entrar';}
  }
}

// Gera hash do dispositivo: canvas + hardware + navegador
function generateDeviceFingerprint() {
  const parts = [
    navigator.userAgent,
    navigator.language || '',
    screen.width + 'x' + screen.height + 'x' + screen.colorDepth,
    String(new Date().getTimezoneOffset()),
    String(navigator.hardwareConcurrency || 0),
    navigator.platform || ''
  ];
  try {
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    c.width = 200; c.height = 30;
    ctx.textBaseline = 'top';
    ctx.font = '14px Arial';
    ctx.fillStyle = '#c9376c';
    ctx.fillRect(0, 0, 200, 30);
    ctx.fillStyle = '#2a1f2e';
    ctx.fillText('Belle\xb7Agenda v2', 2, 4);
    parts.push(c.toDataURL().slice(-50));
  } catch(e) {}
  const str = parts.join('\x1e');
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = (Math.imul(h, 33) ^ str.charCodeAt(i)) >>> 0;
  return h.toString(36);
}

async function doRegister() {
  showError('');
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  if (!name || !email || !pass) { showError('Preencha todos os campos.'); return; }

  // Verificação rápida local (localStorage)
  const fp = generateDeviceFingerprint();
  if (localStorage.getItem('belle_trial_' + fp)) {
    showError('Este dispositivo já utilizou o período de teste gratuito. Para continuar, contrate um plano em nosso site.');
    return;
  }

  const btn = document.querySelector('#formReg .btn-primary');
  if(btn){btn.disabled=true;btn.textContent='Verificando...';}
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pass);

    // Verificação no Firestore (persiste mesmo após limpar o navegador)
    let fpUsed = false;
    try {
      const fpSnap = await db.collection('trialDevices').doc(fp).get();
      fpUsed = fpSnap.exists;
    } catch(e) { /* fail open — não bloqueia por erro de rede */ }

    if (fpUsed) {
      localStorage.setItem('belle_trial_' + fp, '1');
      await cred.user.delete().catch(() => {});
      showError('Este dispositivo já utilizou o período de teste gratuito. Para continuar, contrate um plano em nosso site.');
      if(btn){btn.disabled=false;btn.textContent='Criar conta';}
      return;
    }

    await db.collection('users').doc(cred.user.uid).collection('settings').doc('profile').set({
      salonName: name, pixKey: '', pixName: name.substring(0,25), pixCity: 'Cidade', professionalName: name.split(' ')[0]
    });
    await db.collection('users').doc(cred.user.uid).collection('services').add(
      {name:'Corte Feminino', price:60, duration:45, commission:40, createdAt: Date.now()}
    );
    const now = Date.now();
    const refCode = sessionStorage.getItem('refCode') || '';
    const subData = {
      email, name,
      status: 'trial',
      createdAt: now,
      trialEndsAt: now + 15 * 24 * 60 * 60 * 1000,
      notes: ''
    };
    if (refCode && refCode !== cred.user.uid) subData.referredBy = refCode;
    await db.collection('subscriptions').doc(cred.user.uid).set(subData);

    // Registra fingerprint do dispositivo
    try {
      await db.collection('trialDevices').doc(fp).set({ uid: cred.user.uid, email, createdAt: now });
      localStorage.setItem('belle_trial_' + fp, '1');
    } catch(e) { /* não-fatal: conta criada mesmo se registro do dispositivo falhar */ }

    sessionStorage.removeItem('refCode');
  } catch(e) {
    showError(friendly(e));
    if(btn){btn.disabled=false;btn.textContent='Criar conta';}
  }
}

async function doReset() {
  const email = document.getElementById('loginEmail').value.trim();
  if (!email) { showError('Digite seu e-mail para redefinir a senha.'); return; }
  const lnk = document.querySelector('.link');
  if(lnk){lnk.disabled=true;lnk.textContent='Enviando...';}
  try {
    await auth.sendPasswordResetEmail(email);
    showError('E-mail de redefinição enviado! Verifique sua caixa de entrada.', true);
  } catch(e) { showError(friendly(e)); }
  finally {
    if(lnk){lnk.disabled=false;lnk.textContent='Esqueci a senha';}
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const tab = document.getElementById('tabLogin').classList.contains('active');
    tab ? doLogin() : doRegister();
  }
});
</script>
</body>
</html>

    </filter>
    <clipPath id="screenClip">
      <rect x="342" y="672" width="396" height="652" rx="14"/>
    </clipPath>
  </defs>

  <!-- Fundo -->
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Círculos decorativos -->
  <circle cx="0" cy="200" r="320" fill="white" opacity="0.04"/>
  <circle cx="1080" cy="400" r="280" fill="white" opacity="0.05"/>
  <circle cx="100" cy="1600" r="350" fill="white" opacity="0.04"/>
  <circle cx="980" cy="1750" r="280" fill="white" opacity="0.04"/>


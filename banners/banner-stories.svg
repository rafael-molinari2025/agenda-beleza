  <text x="634" y="736" font-family="Georgia, serif" font-size="32" fill="#92400E" text-anchor="middle">R$2.400</text>
  <text x="634" y="754" font-family="Arial, sans-serif" font-size="10" fill="#92400E" text-anchor="middle">faturamento</text>


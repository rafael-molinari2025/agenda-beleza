  <text x="540" y="300" font-family="Georgia, serif" font-size="80" fill="white" text-anchor="middle" letter-spacing="-2">Sua agenda</text>
  <text x="540" y="390" font-family="Georgia, serif" font-size="80" fill="white" text-anchor="middle" letter-spacing="-2">de beleza</text>
  <text x="540" y="488" font-family="Georgia, serif" font-size="80" fill="#FDE68A" text-anchor="middle" letter-spacing="-2" font-style="italic">no celular.</text>

  <!-- ===== CELULAR MOCKUP ===== -->

  <text x="540" y="160" font-family="Georgia, serif" font-size="52" fill="white" text-anchor="middle" letter-spacing="-1" opacity="0.95">Belle<tspan font-style="italic">·</tspan>Agenda</text>
  <text x="540" y="196" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.55)" text-anchor="middle" letter-spacing="4">BELEZA &amp; SAÚDE</text>


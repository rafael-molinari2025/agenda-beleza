  <text x="180" y="1468" font-family="Arial, sans-serif" font-size="15" fill="#2A1F2E" text-anchor="middle" font-weight="700">Agenda visual</text>
  <text x="180" y="1488" font-family="Arial, sans-serif" font-size="13" fill="#6B5B6E" text-anchor="middle">por dia</text>

  <text x="380" y="1440" font-family="Arial, sans-serif" font-size="28" fill="#C9376C" text-anchor="middle">💬</text>
  <text x="380" y="1468" font-family="Arial, sans-serif" font-size="15" fill="#2A1F2E" text-anchor="middle" font-weight="700">WhatsApp</text>
  <text x="380" y="1488" font-family="Arial, sans-serif" font-size="13" fill="#6B5B6E" text-anchor="middle">automático</text>

  <text x="580" y="1440" font-family="Arial, sans-serif" font-size="28" fill="#C9376C" text-anchor="middle">💳</text>
  <text x="580" y="1468" font-family="Arial, sans-serif" font-size="15" fill="#2A1F2E" text-anchor="middle" font-weight="700">PIX QR Code</text>
  <text x="580" y="1488" font-family="Arial, sans-serif" font-size="13" fill="#6B5B6E" text-anchor="middle">na hora</text>

  <text x="780" y="1440" font-family="Arial, sans-serif" font-size="28" fill="#C9376C" text-anchor="middle">📊</text>
  <text x="780" y="1468" font-family="Arial, sans-serif" font-size="15" fill="#2A1F2E" text-anchor="middle" font-weight="700">Relatórios</text>
  <text x="780" y="1488" font-family="Arial, sans-serif" font-size="13" fill="#6B5B6E" text-anchor="middle">mensais</text>

  <!-- Divisor interno -->
  <line x1="100" y1="1510" x2="980" y2="1510" stroke="#EDE5E3" stroke-width="1.5"/>

  <!-- Trial badge -->
  <rect x="340" y="1526" width="400" height="44" rx="22" fill="#D1FAE5"/>
  <text x="540" y="1554" font-family="Arial, sans-serif" font-size="17" fill="#065F46" text-anchor="middle" font-weight="700">✓  15 dias de teste 100% gratuito</text>

  <!-- Nenhum app -->
  <text x="540" y="1606" font-family="Arial, sans-serif" font-size="15" fill="#6B5B6E" text-anchor="middle">Funciona no celular · Sem baixar aplicativo</text>

  <text x="540" y="1632" font-family="Arial, sans-serif" font-size="15" fill="#6B5B6E" text-anchor="middle">Sem cartão de crédito</text>


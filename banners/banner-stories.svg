  <text x="540" y="1744" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" font-weight="700">Crie sua conta grátis agora</text>
  <text x="540" y="1768" font-family="Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.8)" text-anchor="middle">bella-agenda-226f0.web.app</text>

  <!-- Swipe up hint -->
  <text x="540" y="1848" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.45)" text-anchor="middle" letter-spacing="2">↑  ACESSE PELO LINK NA BIO</text>
</svg>

  <!-- Notch/câmera -->
  <rect x="472" y="576" width="136" height="22" rx="11" fill="#1A1225"/>
  <circle cx="540" cy="587" r="7" fill="#0F0B18"/>

  <!-- CONTEÚDO DA TELA -->
  <!-- Header do app -->
  <rect x="342" y="584" width="396" height="72" rx="36" fill="url(#screenGrad)" clip-path="url(#screenClip)"/>
  <rect x="342" y="620" width="396" height="36" fill="url(#screenGrad)" clip-path="url(#screenClip)"/>
  <text x="540" y="614" font-family="Georgia, serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">Belle·Agenda</text>
  <text x="540" y="634" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle" letter-spacing="1">PAINEL</text>


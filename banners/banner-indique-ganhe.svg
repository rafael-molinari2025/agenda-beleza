<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9376C"/>
      <stop offset="60%" style="stop-color:#A82959"/>
      <stop offset="100%" style="stop-color:#7B1D42"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" stop-opacity="1"/>
      <stop offset="100%" style="stop-color:#FDF0F4" stop-opacity="1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#2A1F2E" flood-opacity="0.25"/>
    </filter>
    <filter id="glowBtn">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#C9376C" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fundo gradiente -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Círculos decorativos de fundo -->
  <circle cx="100" cy="120" r="260" fill="white" opacity="0.05"/>
  <circle cx="980" cy="960" r="300" fill="white" opacity="0.05"/>
  <circle cx="960" cy="140" r="180" fill="white" opacity="0.04"/>
  <circle cx="140" cy="940" r="200" fill="white" opacity="0.04"/>

  <!-- Pontos decorativos -->
  <circle cx="200" cy="400" r="6" fill="white" opacity="0.2"/>
  <circle cx="880" cy="350" r="8" fill="white" opacity="0.15"/>
  <circle cx="150" cy="700" r="5" fill="white" opacity="0.18"/>
  <circle cx="920" cy="650" r="7" fill="white" opacity="0.15"/>
  <circle cx="540" cy="80" r="5" fill="white" opacity="0.2"/>

  <!-- Logo topo -->
  <text x="540" y="110" font-family="Georgia, serif" font-size="32" fill="white" text-anchor="middle" opacity="0.85" letter-spacing="-0.5">Belle<tspan font-style="italic" opacity="1">·</tspan>Agenda</text>

  <!-- Card central -->
  <rect x="100" y="148" width="880" height="784" rx="36" fill="url(#cardGrad)" filter="url(#shadow)"/>

  <!-- Ícone presente -->
  <circle cx="540" cy="290" r="96" fill="#FEF3C7"/>
  <!-- Caixa do presente -->
  <rect x="490" y="258" width="100" height="80" rx="8" fill="#F59E0B"/>
  <rect x="490" y="258" width="100" height="22" rx="6" fill="#D97706"/>
  <!-- Laço -->
  <ellipse cx="520" cy="258" rx="18" ry="28" fill="none" stroke="#B45309" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="560" cy="258" rx="18" ry="28" fill="none" stroke="#B45309" stroke-width="5" stroke-linecap="round"/>
  <line x1="540" y1="230" x2="540" y2="340" stroke="#B45309" stroke-width="5" stroke-linecap="round"/>
  <!-- Estrelinhas ao redor -->
  <text x="430" y="265" font-family="Arial" font-size="22" fill="#F59E0B" opacity="0.7">✦</text>
  <text x="618" y="270" font-family="Arial" font-size="18" fill="#F59E0B" opacity="0.6">✦</text>
  <text x="452" y="340" font-family="Arial" font-size="14" fill="#F59E0B" opacity="0.5">✦</text>
  <text x="605" y="330" font-family="Arial" font-size="20" fill="#F59E0B" opacity="0.65">✦</text>

  <!-- Headline -->
  <text x="540" y="440" font-family="Georgia, serif" font-size="68" fill="#2A1F2E" text-anchor="middle" letter-spacing="-2" font-weight="normal">Indique</text>
  <text x="540" y="514" font-family="Georgia, serif" font-size="68" fill="#C9376C" text-anchor="middle" letter-spacing="-2" font-style="italic">1 colega.</text>

  <!-- Subtítulo -->
  <text x="540" y="576" font-family="Arial, sans-serif" font-size="30" fill="#2A1F2E" text-anchor="middle" font-weight="700">Ganhe +30 dias grátis.</text>

  <!-- Divisor -->
  <line x1="240" y1="608" x2="840" y2="608" stroke="#EDE5E3" stroke-width="1.5"/>

  <!-- Como funciona -->
  <text x="540" y="650" font-family="Arial, sans-serif" font-size="16" fill="#6B5B6E" text-anchor="middle" letter-spacing="2.5">COMO FUNCIONA</text>

  <!-- Passo 1 -->
  <circle cx="200" cy="716" r="26" fill="#F4D5DD"/>
  <text x="200" y="724" font-family="Arial, sans-serif" font-size="20" fill="#C9376C" text-anchor="middle" font-weight="700">1</text>
  <text x="240" y="710" font-family="Arial, sans-serif" font-size="18" fill="#2A1F2E" font-weight="600">Copie seu link exclusivo</text>
  <text x="240" y="733" font-family="Arial, sans-serif" font-size="15" fill="#6B5B6E">Configurações → Indique e Ganhe</text>

  <!-- Passo 2 -->
  <circle cx="200" cy="790" r="26" fill="#F4D5DD"/>
  <text x="200" y="798" font-family="Arial, sans-serif" font-size="20" fill="#C9376C" text-anchor="middle" font-weight="700">2</text>
  <text x="240" y="784" font-family="Arial, sans-serif" font-size="18" fill="#2A1F2E" font-weight="600">Envie para uma colega</text>
  <text x="240" y="807" font-family="Arial, sans-serif" font-size="15" fill="#6B5B6E">WhatsApp, Instagram, grupo...</text>

  <!-- Passo 3 -->
  <circle cx="200" cy="864" r="26" fill="#D1FAE5"/>
  <text x="200" y="872" font-family="Arial, sans-serif" font-size="20" fill="#065F46" text-anchor="middle" font-weight="700">✓</text>
  <text x="240" y="858" font-family="Arial, sans-serif" font-size="18" fill="#2A1F2E" font-weight="600">Ela cria a conta → você ganha</text>
  <text x="240" y="881" font-family="Arial, sans-serif" font-size="15" fill="#065F46" font-weight="600">+30 dias gratuitos sem limite de indicações</text>

  <!-- Botão CTA -->
  <rect x="280" y="898" width="520" height="62" rx="31" fill="#C9376C" filter="url(#glowBtn)"/>
  <text x="540" y="937" font-family="Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="700" letter-spacing="0.5">Acesse Configurações e compartilhe →</text>

  <!-- Site rodapé -->
  <text x="540" y="1016" font-family="Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.6)" text-anchor="middle" letter-spacing="1">bella-agenda-226f0.web.app</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF7F4"/>
      <stop offset="100%" style="stop-color:#F4D5DD"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C9376C"/>
      <stop offset="100%" style="stop-color:#A82959"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#2A1F2E" flood-opacity="0.10"/>
    </filter>
    <filter id="cardshadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#2A1F2E" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Círculo decorativo top-left -->
  <circle cx="80" cy="100" r="180" fill="#F4D5DD" opacity="0.45"/>
  <!-- Círculo decorativo bottom-right -->
  <circle cx="1020" cy="990" r="220" fill="#B8956A" opacity="0.08"/>

  <!-- Card central -->
  <rect x="80" y="100" width="920" height="880" rx="40" fill="white" filter="url(#shadow)" opacity="0.92"/>

  <!-- Linha decorativa topo do card -->
  <rect x="80" y="100" width="920" height="10" rx="5" fill="url(#btnGrad)"/>

  <!-- Logo / marca -->
  <text x="540" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#2A1F2E" text-anchor="middle" letter-spacing="-1">Belle<tspan fill="#C9376C" font-style="italic">·</tspan>Agenda</text>
  <text x="540" y="232" font-family="Arial, sans-serif" font-size="14" fill="#6B5B6E" text-anchor="middle" letter-spacing="4">BELEZA &amp; SAÚDE</text>

  <!-- Divisor -->
  <line x1="240" y1="258" x2="840" y2="258" stroke="#EDE5E3" stroke-width="1.5"/>

  <!-- BLOCO ANTES -->
  <!-- Card papel -->
  <rect x="120" y="290" width="360" height="360" rx="24" fill="#F9F6F3" filter="url(#cardshadow)"/>
  <!-- Ícone caderno -->
  <rect x="215" y="330" width="170" height="210" rx="10" fill="#E8E0D8" stroke="#D4C8BC" stroke-width="2"/>
  <rect x="215" y="330" width="28" height="210" rx="10" fill="#C9376C" opacity="0.3"/>
  <!-- Linhas do caderno -->
  <line x1="260" y1="375" x2="368" y2="375" stroke="#C4B8B0" stroke-width="2" stroke-linecap="round"/>
  <line x1="260" y1="400" x2="355" y2="400" stroke="#C4B8B0" stroke-width="2" stroke-linecap="round"/>
  <line x1="260" y1="425" x2="368" y2="425" stroke="#C4B8B0" stroke-width="2" stroke-linecap="round"/>
  <line x1="260" y1="450" x2="340" y2="450" stroke="#C4B8B0" stroke-width="2" stroke-linecap="round"/>
  <line x1="260" y1="475" x2="368" y2="475" stroke="#C4B8B0" stroke-width="2" stroke-linecap="round"/>
  <line x1="260" y1="500" x2="350" y2="500" stroke="#C4B8B0" stroke-width="2" stroke-linecap="round"/>
  <!-- X vermelho sobre caderno -->
  <circle cx="370" cy="340" r="26" fill="#FEE2E2"/>
  <text x="370" y="349" font-family="Arial" font-size="26" fill="#B91C1C" text-anchor="middle" font-weight="bold">✕</text>
  <!-- Label ANTES -->
  <text x="300" y="630" font-family="Arial, sans-serif" font-size="20" fill="#6B5B6E" text-anchor="middle" font-weight="600" letter-spacing="3">ANTES</text>
  <text x="300" y="660" font-family="Arial, sans-serif" font-size="15" fill="#9B8B8E" text-anchor="middle">Caderninho e WhatsApp</text>

  <!-- Seta central -->
  <text x="540" y="495" font-family="Arial" font-size="64" fill="#C9376C" text-anchor="middle">→</text>

  <!-- BLOCO DEPOIS -->
  <!-- Card celular -->
  <rect x="600" y="290" width="360" height="360" rx="24" fill="#FDF0F4" filter="url(#cardshadow)"/>
  <!-- Celular -->
  <rect x="672" y="316" width="216" height="308" rx="22" fill="#2A1F2E"/>
  <rect x="680" y="332" width="200" height="276" rx="14" fill="white"/>
  <!-- Tela do app simulada -->
  <rect x="680" y="332" width="200" height="48" rx="14" fill="#C9376C"/>
  <text x="780" y="356" font-family="Georgia,serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Belle·Agenda</text>
  <text x="780" y="372" font-family="Arial,sans-serif" font-size="9" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="1">PAINEL</text>
  <!-- Cards no app -->
  <rect x="688" y="390" width="88" height="56" rx="8" fill="#FAF7F4"/>
  <text x="732" y="412" font-family="Arial,sans-serif" font-size="9" fill="#6B5B6E" text-anchor="middle">Hoje</text>
  <text x="732" y="432" font-family="Arial,sans-serif" font-size="18" fill="#2A1F2E" text-anchor="middle" font-weight="700">4</text>
  <rect x="784" y="390" width="88" height="56" rx="8" fill="#FEF3C7"/>
  <text x="828" y="412" font-family="Arial,sans-serif" font-size="9" fill="#92400E" text-anchor="middle">Faturamento</text>
  <text x="828" y="432" font-family="Arial,sans-serif" font-size="12" fill="#92400E" text-anchor="middle" font-weight="700">R$480</text>
  <!-- Agendamentos simulados -->
  <rect x="688" y="456" width="184" height="36" rx="6" fill="#FAF7F4"/>
  <rect x="694" y="463" width="4" height="22" rx="2" fill="#C9376C"/>
  <text x="705" y="474" font-family="Arial,sans-serif" font-size="10" fill="#2A1F2E" font-weight="600">09:00 · Ana Lima</text>
  <text x="705" y="487" font-family="Arial,sans-serif" font-size="9" fill="#6B5B6E">Corte Feminino · R$80</text>
  <rect x="688" y="498" width="184" height="36" rx="6" fill="#FAF7F4"/>
  <rect x="694" y="505" width="4" height="22" rx="2" fill="#B8956A"/>
  <text x="705" y="516" font-family="Arial,sans-serif" font-size="10" fill="#2A1F2E" font-weight="600">11:00 · Carla Souza</text>
  <text x="705" y="529" font-family="Arial,sans-serif" font-size="9" fill="#6B5B6E">Escova · R$60</text>
  <!-- Botão pix simulado -->
  <rect x="688" y="544" width="184" height="28" rx="14" fill="#C9376C"/>
  <text x="780" y="562" font-family="Arial,sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="700">PIX QR Code</text>
  <!-- Check verde -->
  <circle cx="620" cy="340" r="26" fill="#D1FAE5"/>
  <text x="620" y="349" font-family="Arial" font-size="22" fill="#065F46" text-anchor="middle" font-weight="bold">✓</text>
  <!-- Label DEPOIS -->
  <text x="780" y="630" font-family="Arial, sans-serif" font-size="20" fill="#C9376C" text-anchor="middle" font-weight="700" letter-spacing="3">DEPOIS</text>
  <text x="780" y="660" font-family="Arial, sans-serif" font-size="15" fill="#9B8B8E" text-anchor="middle">Belle·Agenda no celular</text>

  <!-- Headline principal -->
  <text x="540" y="740" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#2A1F2E" text-anchor="middle" letter-spacing="-1.5">Chega de agenda</text>
  <text x="540" y="800" font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#C9376C" text-anchor="middle" font-style="italic" letter-spacing="-1.5">bagunçada.</text>

  <!-- Subtexto -->
  <text x="540" y="852" font-family="Arial, sans-serif" font-size="22" fill="#6B5B6E" text-anchor="middle">Agenda · PIX · WhatsApp automático · Relatórios</text>

  <!-- Botão CTA -->
  <rect x="330" y="888" width="420" height="64" rx="32" fill="url(#btnGrad)"/>
  <text x="540" y="928" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="700" letter-spacing="0.5">Teste grátis por 15 dias →</text>

  <!-- Rodapé -->
  <text x="540" y="986" font-family="Arial, sans-serif" font-size="16" fill="#9B8B8E" text-anchor="middle" letter-spacing="1">bella-agenda-226f0.web.app</text>
</svg>
